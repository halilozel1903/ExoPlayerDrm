# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional DRM overrides (rebuild after changing).
# Google Widevine radios always use the published Media3 demo test stream + UAT proxy.
# Custom Widevine stays in MISSING LICENSE URL until you set a real license URI.
# drm.widevine.manifestUri=https://your-cdn.example/stream.mpd
# drm.widevine.licenseUri=https://your-widevine-license-server.example/license
# Optional license HTTP headers: Header-Name=value|Another=value
# drm.widevine.licenseRequestHeaders=
#
# ClearKey is not bundled (no keys, no license server). Provide a ClearKey DASH
# manifest plus either a license URL or a local W3C ClearKey JSON file.
# drm.clearkey.manifestUri=
# drm.clearkey.licenseUri=
# drm.clearkey.keysFile=local-clearkey.json
# drm.clearkey.keysJson=
