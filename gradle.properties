# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional DRM overrides (rebuild after changing).
# Leave unset to use Google's published Media3 demo Widevine test stream + UAT proxy.
# drm.widevine.manifestUri=https://storage.googleapis.com/wvmedia/cenc/h264/tears/tears.mpd
# drm.widevine.licenseUri=https://your-widevine-license-server.example/license
#
# ClearKey is not bundled. Provide both a ClearKey-protected DASH manifest and a
# license URL that returns W3C ClearKey JSON for that content.
# drm.clearkey.manifestUri=
# drm.clearkey.licenseUri=
